[build-system]
# >=77 is the floor for emitting the SPDX expression below as PEP 639
# Metadata-Version 2.4 without deprecated license-table/classifier warnings.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismaquant"
version = "0.16.2"
description = "Mixed-precision quantization allocator for LLMs: every layer refracts into a different format based on its sensitivity."
readme = "README.md"
license = "LicenseRef-PrismaQuant-Attribution-1.0"
# 3.12 is the supported floor as of 2026-08-29. Hosted CI and release checks
# exercise that floor; a newer interpreter is also supported.
# Python 3.11 is no longer tested or claimed as supported.
requires-python = ">=3.12"
authors = [
    { name = "Rob Tand" },
]
keywords = ["llm", "quantization", "nvfp4", "mxfp8", "fisher", "moe", "mtp", "compressed-tensors", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "safetensors>=0.4",
    "transformers>=5.0",
    "datasets>=3.0",
    "accelerate>=0.30",
    "compressed-tensors>=0.15",
    "gguf>=0.17",
    # Multimodal calibration builds synthetic PIL images
    # (sensitivity_probe._synthetic_multimodal_calibration_samples). Without
    # it that function returns [] -- zero calibration samples, no error -- so
    # the VL probe path silently does nothing. It was never declared.
    "pillow>=10.0",
    "tqdm",
    # Publisher validates model-card front matter without loading Hub bindings.
    "PyYAML>=6.0",
    # tools/measure_served_gold.py imports it at module top (:72). It was only
    # ever installed transitively, so a venv without it aborted collection of
    # tests/test_measure_served_gold.py (PQ #1454, #1458).
    "requests>=2.31",
    # Stage B spill verifies each replay operand with xxh3_64 (PQ #1369).
    "xxhash>=3.7.0",
    # torch cpp_extension.load runs the ninja executable at runtime (kernels/cuda_allocator_state.py).
    "ninja>=1.11",
]

[project.optional-dependencies]
serve = ["vllm>=0.19"]
task-suite = ["lm-eval[hf]==0.4.12"]
# pytest-timeout is not optional in practice: CI runs the suite unattended,
# and a hung test without it burns the whole job timeout instead of failing.
test = ["torch>=2.6", "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "pytest-xdist>=3.8",
        # tests/test_prismaquant_visual_phase2.py imports PIL at module
        # level; a venv without pillow fails at collection (observed in the
        # a campaign venv, 2026-10-04). Runtime deps already declare it;
        # this records the test-scope need for --no-deps provisions.
        "pillow>=10.0"]

[project.urls]
Repository = "https://github.com/RobTand/prismaquant"

[tool.setuptools.packages.find]
include = ["prismaquant*"]

[tool.setuptools.package-data]
prismaquant = [
    "*.sh",
    "kernels/*.cpp",
    "kernels/*.cu",
    "kernels/*_qualification.json",
    "data/*.pt",
    "data/*.json",
    "model_profiles/specs/*.json",
    "serving_profile_specs/*.json",
    "serve_dispatch_tables/*.json",
    "lane_specs/*.json",
    "tessera_runtime/shape_time_checker_config.json",
    "tessera_runtime/reviewed_answer.json",
    "tessera_runtime/tessera_serving_runtime_pin.json",
]

[tool.tl3.harness]
command = ["python", "-m", "pytest"]
test-files = ["tests/**/*.py"]

[tool.uv]
# Match the hosted gate's .github/ci-constraints.txt pins without narrowing
# published dependency ranges. tests/test_uv_lock_ci_constraints.py checks
# every hosted pin against the resolved lock.
constraint-dependencies = ["transformers==5.16.1", "pytest==9.1.1"]
# Resolve the hosted test environment separately from optional serving and
# evaluation stacks, whose torch/numpy pins otherwise constrain the test lock.
conflicts = [
    [{ extra = "test" }, { extra = "serve" }],
    [{ extra = "test" }, { extra = "task-suite" }],
]

[tool.uv.sources]
# Keep ordinary uv sync and serving on PyPI; only the test extra uses CPU wheels.
torch = { index = "pytorch-cpu", extra = "test" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only torch uses this index; its aarch64 triton must not enter the x64 hub.
explicit = true
