[pytest]
testpaths = tests
pythonpath = .
markers =
    own_process: the module needs a pytest process of its own. In a shared session, its tests run in one child pytest and report under their own node ids (PQ #1008).
    slow: requires a real model, network/cache access, or long runtime
    cuda: requires CUDA hardware
    integration: crosses process, model-load, or artifact boundaries
    own_cgroup: reads this process's cgroup, so no other test process may share it. Skips beside other pytest-xdist workers (tests/cgroup_readings.py); CI runs these tests without xdist in a systemd scope of their own.
    fleet_data: reads fleet-local campaign data or live PrismaBuild state that no PB action declares (PQ #1014). Skipped unless -m names fleet_data or PQ_FLEET_DATA_TESTS=1.
    task_suite: requires the layered task-suite gate. Explicit receipt-named skips unless -m names task_suite or PQ_TASK_SUITE_TESTS=1.
