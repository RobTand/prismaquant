# prismaquant release: build, verify, publish to PyPI, attach to a GitHub Release.
#
# TRIGGER: tag pushes matching `v*` ONLY. There is deliberately no
# `push: branches:` and no `release:` trigger, so this file is safe to merge
# before the PyPI project exists — merging it, or any later commit to main, can
# never attempt an upload. The first publish happens only when a human pushes a
# tag.
#
# ROUTING: a PEP 440 pre-release version (v0.2.0rc1, v0.2.0a1, ...) goes to
# TestPyPI; a final version goes to PyPI. A PyPI version number can never be
# reused, even after deleting the release, so rehearse with an rc.
#
# AUTH: Trusted Publishing (OIDC). No API token, no repository secret. The
# one-time PyPI-side setup — and the pending-publisher trap that cost us a
# release on the sibling project — is written out in docs/RELEASING.md. Until
# that setup is done the publish job fails with an OIDC error and nothing is
# uploaded.
#
# Action pins are exact patch tags, not floating major refs: a re-pointable ref
# is a supply-chain surface, and the publish job holds an OIDC token that can
# upload under our project name. Same rationale as ci.yml.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      environment: ${{ steps.meta.outputs.environment }}
      repository_url: ${{ steps.meta.outputs.repository_url }}
      project_url: ${{ steps.meta.outputs.project_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/main^{commit}" || {
            echo "release tag ${GITHUB_REF_NAME} at ${GITHUB_SHA} is not on main" >&2
            exit 1
          }

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine packaging

      - name: Build
        run: python -m build

      - name: twine check
        run: python -m twine check --strict dist/*

      # prismaquant is pure Python, so the packaging risk is the runtime JSON
      # (model-structure + serving-constraint specs) and run-pipeline.sh. A
      # package-data regression still imports cleanly and only fails when a
      # user asks for a profile, so it must be caught here.
      - name: Assert runtime data files are packaged
        run: python .github/scripts/check_dist.py dist .

      # The tag is the release's identity; if it disagrees with the version
      # baked into the artifact, the wrong thing is about to be published under
      # the wrong name. Fail before any upload.
      - name: Tag must match the built version
        id: meta
        run: |
          python - "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" <<'PY'
          import glob, os, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = sys.argv[1]
          if not tag.startswith("v"):
              sys.exit(f"tag {tag!r} must be of the form vX.Y.Z")
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, got {wheels}")
          _, built, _, _ = parse_wheel_filename(os.path.basename(wheels[0]))
          want = Version(tag[1:])
          if want != built:
              sys.exit(f"tag {tag} means version {want}, but the build produced "
                       f"{built}. Bump the version in pyproject.toml, commit, "
                       "then re-tag.")
          pre = built.is_prerelease
          print(f"version={built}")
          print(f"prerelease={str(pre).lower()}")
          print(f"environment={'testpypi' if pre else 'pypi'}")
          print("repository_url=" + ("https://test.pypi.org/legacy/" if pre
                                     else "https://upload.pypi.org/legacy/"))
          print("project_url=" + ("https://test.pypi.org/p/prismaquant" if pre
                                  else "https://pypi.org/p/prismaquant"))
          print(f"{built} -> {'TestPyPI' if pre else 'PyPI'}", file=sys.stderr)
          PY

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The gate a broken package cannot pass: the wheel is installed
  # non-editably into a clean interpreter, the tests are staged OUTSIDE the
  # checkout so imports cannot fall back to the source tree, and the runtime
  # specs must resolve from site-packages.
  verify:
    name: verify installed wheel
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      # CPU torch explicitly: the default PyPI wheel drags a full CUDA stack
      # that nothing here can use. Same rationale as ci.yml.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install the wheel with its dependencies
        run: python -m pip install dist/*.whl

      # Runs from $RUNNER_TEMP with no PYTHONPATH so `import prismaquant`
      # cannot fall back to the checkout: it must resolve from site-packages,
      # every serving profile must load out of the installed JSON, the
      # model-structure specs and run-pipeline.sh must be present in the
      # package, and the CLI must work.
      #
      # This is deliberately NOT "re-run the whole suite against the install".
      # A large part of the suite asserts REPOSITORY invariants rather than
      # package behaviour — the pinned recipe defaults in run-pipeline.sh, doc
      # staleness, paper claims, calibration-anchor source docs — and several
      # tests read prismaquant's own .py files as source text from a
      # repo-relative path. Those cannot pass from outside a checkout by
      # construction, and forcing them to would mean weakening them. Main and
      # manual CI runs cover the full checkout suite; PRs use the required
      # composed PrismaBuild pb-tests gate. This job proves the
      # ARTIFACT is complete and usable.
      - name: Post-install checks
        working-directory: ${{ runner.temp }}
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python "${GITHUB_WORKSPACE}/.github/scripts/check_installed.py"

  publish:
    name: publish to ${{ needs.build.outputs.environment }}
    needs: [build, verify]
    runs-on: ubuntu-24.04
    # A fork that pushes a v* tag must never attempt to publish prismaquant.
    if: github.repository == 'RobTand/prismaquant'
    environment:
      # `pypi` / `testpypi` GitHub environments. Add a required reviewer to the
      # `pypi` environment to put a human approval gate in front of the one
      # irreversible step in this workflow (docs/RELEASING.md).
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.project_url }}
    permissions:
      id-token: write   # OIDC token for Trusted Publishing. Nothing else.
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      # Pinned to an exact release rather than the `release/v1` branch PyPA's
      # docs suggest: a branch ref is re-pointable, and this action holds a
      # token that can upload under our project name. Publishes everything in
      # dist/ plus PEP 740 attestations. `skip-existing` is deliberately NOT
      # set — republishing an existing version is a mistake and PyPI must
      # refuse it loudly.
      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          repository-url: ${{ needs.build.outputs.repository_url }}
          print-hash: true

  github-release:
    name: github release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job may write to the repo
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      # gh is preinstalled on GitHub-hosted runners. GH_REPO is required
      # because this job deliberately does not check out the repo, so gh has no
      # git remote to infer the target from.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "prismaquant ${VERSION}")
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" dist/*
