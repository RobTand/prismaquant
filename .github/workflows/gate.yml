name: Merge gate
'on':
  pull_request:
    # No label triggers: Mergify adds and removes its own labels on queued pull
    # requests, and each would rerun pr-gate, which the queue requires.
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  # The planner reads quarantine owner issues with the job token.
  issues: read
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # Test execution destinations. Control jobs bootstrap on the hosted x64 image.
  GATE_SHARDS: '12'
  GATE_PR_SINGLE_SECONDS: '90'
  GATE_RUNNERS: '["ubuntu-24.04-arm","ubuntu-24.04"]'
  PYTHONPATH: .
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  TORCHINDUCTOR_COMPILE_THREADS: '1'
  MAX_JOBS: '1'
  CUDA_VISIBLE_DEVICES: ''
  GIT_AUTHOR_NAME: PrismaBuild CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: PrismaBuild CI
  GIT_COMMITTER_EMAIL: ci@example.invalid
  GATE_BASE: ${{ github.event.pull_request.base.sha }}
  GATE_HEAD: ${{ github.event.pull_request.head.sha }}
  GATE_MODE: ${{ github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary')) && 'full' || 'selection' }}
jobs:
  plan:
    name: Plan selected or full gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      compatible: ${{ steps.head-contract.outputs.compatible }}
      policy_exit: ${{ steps.plan.outputs.policy_exit }}
    steps:
    - name: Explain skipped fork uploads
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: 'echo "artifact uploads skipped: fork PR has no secrets to scan for"'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require current gate tooling in the PR head
      id: head-contract
      shell: bash
      run: |
        set -Eeuo pipefail
        for file in tools/ci/gate_select.py tools/ci/gate_run.py tools/ci/gate_collect.py tools/ci/gate_partition.py tools/ci/gate_actions.py tools/ci/gate_budget.json tools/ci/gate_durations.json tools/ci/gate_quarantine.json tools/ci/gate_paths.py; do
          if [ ! -f "$file" ]; then
            echo 'compatible=false' >> "$GITHUB_OUTPUT"
            echo "GATE_TEST_FAILURE: PR head predates gate tooling ($file); merge origin/main and push again."
            exit 1
          fi
        done
        echo 'compatible=true' >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Plan coverage and balanced shards
      id: plan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: planning infrastructure failed"; exit 75' ERR
        mkdir -p gate-artifacts
        if python tools/ci/gate_select.py --base "$GATE_BASE" --head "$GATE_HEAD" \
          --mode "$GATE_MODE" --output gate-artifacts/plan.json \
          --files-output gate-artifacts/population.txt --summary "$GITHUB_STEP_SUMMARY"; then
          echo 'policy_exit=0' >> "$GITHUB_OUTPUT"
        else
          code=$?
          echo "policy_exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
        fi
        runners=$(python - <<'PYTHON'
        import json, os
        labels = json.loads(os.environ['GATE_RUNNERS'])
        if os.environ['GATE_MODE'] == 'full' and int(os.environ['GITHUB_RUN_ATTEMPT']) % 2 == 0:
            labels.reverse()
        print(','.join(labels))
        PYTHON
        )
        selection=()
        if [ "$GATE_MODE" = selection ]; then
          selection=(--single-shard-seconds "$GATE_PR_SINGLE_SECONDS" --workers 4)
        fi
        python tools/ci/gate_partition.py matrix --files-from gate-artifacts/population.txt \
          --durations tools/ci/gate_durations.json --shards "$GATE_SHARDS" \
          --runners "$runners" "${selection[@]}" --output gate-artifacts/matrix.json
        python - <<'PYTHON'
        import json, math, os
        from pathlib import Path
        matrix = json.loads(Path('gate-artifacts/matrix.json').read_text())
        for row in matrix['include']:
            row['timeout_minutes'] = max(15, math.ceil(row['estimated_seconds'] * 1.5 / 4 / 60) + 10)
        Path('gate-artifacts/job-matrix.json').write_text(json.dumps(matrix) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('matrix=' + json.dumps({'include': matrix['include']}, separators=(',', ':')) + '\n')
            output.write('shards=' + str(matrix['shards']) + '\n')
        PYTHON
    - name: Scan artifact paths for secrets
      id: scan-artifacts-1
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-1.outcome == 'success' }}
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
        retention-days: 7
    - name: Scan artifact paths for secrets
      id: scan-artifacts-2
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts/plan.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-2.outcome == 'success' }}
      with:
        name: gate-shadow-selection-${{ github.run_attempt }}
        path: gate-artifacts/plan.json
        retention-days: 7
  shards:
    name: shard-${{ matrix.index }}-a1
    needs: plan
    if: ${{ needs.plan.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
    - name: Configure owned temporary space
      shell: bash
      run: |
        printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
    - name: Compute assignment before setup
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: assignment infrastructure failed"; exit 75' ERR
        python3 tools/ci/gate_partition.py shard --files-from gate-artifacts/population.txt             --durations tools/ci/gate_durations.json --shards "${{ needs.plan.outputs.shards }}"             --matrix gate-artifacts/job-matrix.json --index "${{ matrix.index }}" --output-files gate-artifacts/assigned.txt --output-assignment gate-artifacts/assignment.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          .github/ci-constraints.txt
          prismaquant/tessera_runtime/tessera_serving_runtime_pin.json
    - name: Resolve Tessera development pin
      id: tessera-pin
      run: |
        tessera_commit="$(python tools/resolve_tessera_dev_pin.py)"
        printf 'commit=%s\n' "$tessera_commit" >> "$GITHUB_OUTPUT"
    - name: Check out pinned Tessera
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: RobTand/tessera
        ref: ${{ steps.tessera-pin.outputs.commit }}
        persist-credentials: false
        path: .ci/tessera
    - name: Install CPU test environment
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: dependency setup failed"; exit 75' ERR
        python -m pip install --upgrade pip
        python -m pip install --no-deps .ci/tessera
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -c .github/ci-constraints.txt -e '.[test]'
        python --version
        python -m pip --version
    - name: Run assigned gate tests
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: assignment or execution infrastructure failed"; exit 75' ERR
        printf '## Shard %s, attempt 1\n\n' '${{ matrix.index }}' >> "$GITHUB_STEP_SUMMARY"
        wc -l gate-artifacts/assigned.txt >> "$GITHUB_STEP_SUMMARY"
        if python tools/ci/gate_run.py --plan gate-artifacts/plan.json             --assignment gate-artifacts/assignment.json --workers 4             --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml; then
          code=0
        else
          code=$?
        fi
        case "$code" in
          0) marker=GATE_PASS;;
          1) marker=GATE_TEST_FAILURE;;
          *) marker=NO_VERDICT; code=75;;
        esac
        echo "$marker: shard ${{ matrix.index }}, attempt 1" | tee -a "$GITHUB_STEP_SUMMARY"
        exit "$code"
    - name: Scan artifact paths for secrets
      id: scan-artifacts-3
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts/result.json gate-artifacts/junit.xml
    - name: Upload verdict and JUnit
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-3.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gate-result-${{ github.run_attempt }}-a1-${{ matrix.index }}
        path: |
          gate-artifacts/result.json
          gate-artifacts/junit.xml
        if-no-files-found: warn
        retention-days: 7
  retry-plan:
    name: Plan infrastructure retry
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
    - plan
    - shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      retry: ${{ steps.retry.outputs.retry }}
      matrix: ${{ steps.retry.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          tools/ci
          prismaquant
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
    - name: Download first attempt verdicts
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: gate-result-${{ github.run_attempt }}-a1-*
        path: verdicts
    - name: Retry only missing verdicts
      id: retry
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: retry planning infrastructure failed"; exit 75' ERR
        python3 tools/ci/gate_actions.py retries --plan gate-artifacts/plan.json             --matrix gate-artifacts/job-matrix.json --artifacts verdicts             --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/retry-matrix.json             >> "$GITHUB_OUTPUT"
  retry-shards:
    name: shard-${{ matrix.index }}-a2
    if: ${{ !cancelled() && needs.retry-plan.result == 'success' && needs.retry-plan.outputs.retry == 'true' }}
    needs:
    - plan
    - retry-plan
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
    - name: Configure owned temporary space
      shell: bash
      run: |
        printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
    - name: Compute assignment before setup
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: assignment infrastructure failed"; exit 75' ERR
        python3 tools/ci/gate_partition.py shard --files-from gate-artifacts/population.txt             --durations tools/ci/gate_durations.json --shards "${{ needs.plan.outputs.shards }}"             --matrix gate-artifacts/job-matrix.json --index "${{ matrix.index }}" --output-files gate-artifacts/assigned.txt --output-assignment gate-artifacts/assignment.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          .github/ci-constraints.txt
          prismaquant/tessera_runtime/tessera_serving_runtime_pin.json
    - name: Resolve Tessera development pin
      id: tessera-pin
      run: |
        tessera_commit="$(python tools/resolve_tessera_dev_pin.py)"
        printf 'commit=%s\n' "$tessera_commit" >> "$GITHUB_OUTPUT"
    - name: Check out pinned Tessera
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: RobTand/tessera
        ref: ${{ steps.tessera-pin.outputs.commit }}
        persist-credentials: false
        path: .ci/tessera
    - name: Install CPU test environment
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: dependency setup failed"; exit 75' ERR
        python -m pip install --upgrade pip
        python -m pip install --no-deps .ci/tessera
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -c .github/ci-constraints.txt -e '.[test]'
        python --version
        python -m pip --version
    - name: Run assigned gate tests
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "NO_VERDICT: assignment or execution infrastructure failed"; exit 75' ERR
        printf '## Shard %s, attempt 2\n\n' '${{ matrix.index }}' >> "$GITHUB_STEP_SUMMARY"
        wc -l gate-artifacts/assigned.txt >> "$GITHUB_STEP_SUMMARY"
        if python tools/ci/gate_run.py --plan gate-artifacts/plan.json             --assignment gate-artifacts/assignment.json --workers 4             --result gate-artifacts/result.json --junitxml gate-artifacts/junit.xml; then
          code=0
        else
          code=$?
        fi
        case "$code" in
          0) marker=GATE_PASS;;
          1) marker=GATE_TEST_FAILURE;;
          *) marker=NO_VERDICT; code=75;;
        esac
        echo "$marker: shard ${{ matrix.index }}, attempt 2" | tee -a "$GITHUB_STEP_SUMMARY"
        exit "$code"
    - name: Scan artifact paths for secrets
      id: scan-artifacts-4
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts/result.json gate-artifacts/junit.xml
    - name: Upload verdict and JUnit
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-4.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gate-result-${{ github.run_attempt }}-a2-${{ matrix.index }}
        path: |
          gate-artifacts/result.json
          gate-artifacts/junit.xml
        if-no-files-found: warn
        retention-days: 7
  pr-gate:
    name: pr-gate
    if: ${{ !cancelled() && !(github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary'))) }}
    needs:
    - plan
    - shards
    - retry-plan
    - retry-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Explain unavailable fork verdict
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        echo 'artifact uploads skipped: fork PR has no secrets to scan for'
        echo 'NO_VERDICT: fork PR gate requires plan and shard artifacts; uploads are disabled'
        exit 75
    - name: Require a complete plan
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
        HEAD_COMPATIBLE: ${{ needs.plan.outputs.compatible }}
        POLICY_EXIT: ${{ needs.plan.outputs.policy_exit }}
      run: |
        if [ "$HEAD_COMPATIBLE" = false ]; then
          echo 'GATE_TEST_FAILURE: PR head predates gate tooling; merge origin/main and push again.'
          exit 1
        fi
        if [ "$POLICY_EXIT" = 1 ]; then
          echo 'GATE_POLICY_FAILURE: quarantine policy rejected the plan'
          exit 1
        fi
        if [ "$PLAN_RESULT" != success ]; then
          echo 'NO_VERDICT: gate plan did not complete'
          exit 75
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          tools/ci
          prismaquant
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
    - name: Download attempt verdicts
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: gate-result-${{ github.run_attempt }}-*
        path: verdicts
    - name: Aggregate complete coverage and final verdicts
      run: |
        python3 tools/ci/gate_actions.py finish --plan gate-artifacts/plan.json             --matrix gate-artifacts/job-matrix.json --artifacts verdicts             --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/final.json             --effective-output gate-artifacts/effective --summary "$GITHUB_STEP_SUMMARY"
    - name: Scan artifact paths for secrets
      id: scan-artifacts-5
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts
    - if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-5.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gate-pr-final-${{ github.run_attempt }}
        path: gate-artifacts
        if-no-files-found: warn
        retention-days: 7
  gate:
    name: gate
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && ((startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.user.login == 'mergify[bot]' && github.event.pull_request.user.id == 37929162) || contains(github.event.pull_request.labels.*.name, 'gate-canary')) }}
    needs:
    - plan
    - shards
    - retry-plan
    - retry-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Require a complete plan
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
        HEAD_COMPATIBLE: ${{ needs.plan.outputs.compatible }}
        POLICY_EXIT: ${{ needs.plan.outputs.policy_exit }}
      run: |
        if [ "$HEAD_COMPATIBLE" = false ]; then
          echo 'GATE_TEST_FAILURE: PR head predates gate tooling; merge origin/main and push again.'
          exit 1
        fi
        if [ "$POLICY_EXIT" = 1 ]; then
          echo 'GATE_POLICY_FAILURE: quarantine policy rejected the plan'
          exit 1
        fi
        if [ "$PLAN_RESULT" != success ]; then
          echo 'NO_VERDICT: gate plan did not complete'
          exit 75
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: |
          tools/ci
          prismaquant
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gate-plan-${{ github.run_attempt }}
        path: gate-artifacts
    - name: Download attempt verdicts
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: gate-result-${{ github.run_attempt }}-*
        path: verdicts
    - name: Aggregate complete coverage and final verdicts
      run: |
        python3 tools/ci/gate_actions.py finish --plan gate-artifacts/plan.json             --matrix gate-artifacts/job-matrix.json --artifacts verdicts             --prefix gate-result-${{ github.run_attempt }} --output gate-artifacts/final.json             --effective-output gate-artifacts/effective --summary "$GITHUB_STEP_SUMMARY"
    - name: Scan artifact paths for secrets
      id: scan-artifacts-6
      ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)if:  }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: python3 tools/ci/check_no_secret_leak.py --require BUILDBUDDY_API_KEY --require MERGIFY_TOKEN gate-artifacts
    - if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.scan-artifacts-6.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gate-final-${{ github.run_attempt }}
        path: gate-artifacts
        if-no-files-found: warn
        retention-days: 7
