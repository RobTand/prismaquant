name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name != 'pull_request'
    name: Post-merge Bazel record (amd64 and arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      base: ${{ steps.source.outputs.base }}
      head: ${{ github.sha }}
    env:
      TRUSTED: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: scan-python
      with:
        python-version: '3.14'
    - id: source
      env:
        BEFORE: ${{ github.event.before }}
        HEAD: ${{ github.sha }}
      run: |
        set -Eeuo pipefail
        base="$BEFORE"
        if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
          base="$(git rev-parse "$HEAD^1")"
        fi
        printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
    - name: Run source-bound Remote Bazel controller
      id: controller
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        BASE: ${{ steps.source.outputs.base }}
        HEAD: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -Eeuo pipefail
        python tools/ci/remote_gate.py main --base "$BASE" --head "$HEAD" --branch "$BRANCH" --timeout 20 --output bazel-main-upload
        python - <<'REMOTE_VERDICT'
        import json, os
        from pathlib import Path
        result = json.loads(Path('bazel-main-upload/result.json').read_text())
        if result['verdict'] not in ('pass', 'skipped'):
            raise SystemExit('Remote Bazel evidence failed')
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('verdict=' + result['verdict'] + '\n')
        REMOTE_VERDICT
    - name: Scan exact JSON upload set
      id: scan
      if: ${{ !cancelled() && env.TRUSTED == 'true' && steps.controller.outputs.scopes_ready == 'true' }}
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      run: |
        python - <<'SCAN_JSON'
        from pathlib import Path
        from tools.ci.bazel_artifacts import scan_upload
        raise SystemExit(scan_upload(Path('bazel-main-upload'), ['BUILDBUDDY_API_KEY', 'MERGIFY_TOKEN']))
        SCAN_JSON
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
      with:
        name: bazel-main-${{ github.run_attempt }}
        path: bazel-main-upload/
        if-no-files-found: error
        retention-days: 7
  allowlists:
    name: boundary allowlists only shrink
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Refuse lines added to a shrink-only allowlist
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        status=0
        for f in $(git ls-tree -r --name-only HEAD tests/boundary_allowlists/); do
          if ! git cat-file -e "$BASE:$f" 2>/dev/null; then
            echo "$f is new in this pull request: admitted as a new gate"
            continue
          fi
          added="$(git diff --numstat "$BASE" HEAD -- "$f" | awk '{s += $1} END {print s + 0}')"
          if [ "$added" -gt 0 ]; then
            echo "::error file=$f::$added line(s) added to a shrink-only allowlist"
            status=1
          fi
        done
        exit "$status"
  imports:
    name: import surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
        cache: pip
    - name: Resolve Tessera development pin
      id: tessera-pin
      run: |
        tessera_commit="$(python tools/resolve_tessera_dev_pin.py)"
        printf 'commit=%s\n' "$tessera_commit" >> "$GITHUB_OUTPUT"
    - name: Check out pinned Tessera
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: RobTand/tessera
        ref: ${{ steps.tessera-pin.outputs.commit }}
        persist-credentials: false
        path: .ci/tessera
    - name: Install pinned Tessera
      run: python -m pip install --no-deps .ci/tessera
    - name: Install CPU torch
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Install prismaquant
      run: python -m pip install -c .github/ci-constraints.txt -e .
    - name: Import the package entry points
      env:
        CUDA_VISIBLE_DEVICES: ''
      run: |
        python -c "import prismaquant; print('prismaquant ok')"
        python -m prismaquant.allocator --help > /dev/null && echo "allocator CLI ok"
  hosted-amd64:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.tests.result == 'success' }}
    needs:
    - tests
    uses: ./.github/workflows/bazel-hosted.yml
    with:
      architecture: amd64
      mode: main
      base: ${{ needs.tests.outputs.base }}
      head: ${{ github.sha }}
      trusted: true
      receipt: bazel-main-${{ github.run_attempt }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
  hosted-arm64:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.tests.result == 'success' }}
    needs:
    - tests
    uses: ./.github/workflows/bazel-hosted.yml
    with:
      architecture: arm64
      mode: main
      base: ${{ needs.tests.outputs.base }}
      head: ${{ github.sha }}
      trusted: true
      receipt: bazel-main-${{ github.run_attempt }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
