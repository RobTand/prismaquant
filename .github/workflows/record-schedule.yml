# Probe (#3857): ci.yml's schedule never fired. This file has only schedule and workflow_dispatch, as the
# schedules of this account that do fire. It starts no record; it only shows whether GitHub creates the run.
name: Record schedule
'on':
  schedule:
  - cron: '7,27,47 1-2 * * *'
  workflow_dispatch: null
permissions: {}
jobs:
  probe:
    name: Schedule probe (starts no record)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - run: echo "event=$GITHUB_EVENT_NAME at $(date -u +%H:%M:%SZ)"
