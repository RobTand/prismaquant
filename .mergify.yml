# Mergify merge queue for PrismaQuant. Tracking: #3180.
#
# Two steps keep per-PR feedback separate from testing the integrated SHA:
# - "pr-gate" selects tests from each pull request's changes before queueing.
# - "gate" tests the full gate population on Mergify's temporary draft batch
#   pull request before the original pull requests merge into main.
#
# max_parallel_checks: 2 forces draft batch PRs. In-place checks could rewrite
# the original branch and invalidate the head TL3 approved. Serial mode keeps
# merge order while two batches run checks concurrently. Default batches grow
# from one PR to seven; release batches contain one PR and are served first.
# A failed batch is split to isolate the failing PR. Mergify never retries a
# failed check automatically. Never merge outside the queue.
#
# Add "queue" to queue and remove it to dequeue. After a failure, comment
# "@mergifyio queue"; toggling the label does not reset a dequeued PR.
# The TL3 coordinator will add its separate label-and-approval queue path to
# queue_conditions and pull_request_rules. This change reserves that work.
# TL3's App needs an explicit command allowance because installation does not
# grant a human collaborator's write permission.
# Mergify does not inject classic branch protection here
# (branch_protection_injection_mode: none). The queue conditions name
# "linked issue" themselves, so a required check that runs tests on the PR
# head can never hold a pull request outside the queue, and no required
# check is demanded of the batch draft, whose mergify/merge-queue/ branch
# and body cannot pass the issue rule. Tests are judged by "gate".
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]
  requeue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]

merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: release
    queue_conditions:
      - base = main
      - label = queue
      - label = release
      - -draft
      - check-success = linked issue
      - check-success = pr-gate
    merge_conditions:
      - check-success = gate
    branch_protection_injection_mode: none
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0
    checks_timeout: 30 minutes
  - name: default
    queue_conditions:
      - base = main
      - label = queue
      - -draft
      - check-success = linked issue
      - check-success = pr-gate
    merge_conditions:
      - check-success = gate
    branch_protection_injection_mode: none
    merge_method: merge
    batch_size:
      min: 1
      max: 7
    batch_max_wait_time: 2 minutes
    max_checks_retries: 0
    checks_timeout: 30 minutes

priority_rules:
  - name: release changes first
    conditions:
      - label = release
    priority: high

pull_request_rules:
  - name: queue pull requests labelled "queue"
    conditions:
      - base = main
      - label = queue
      - -draft
    actions:
      queue:
