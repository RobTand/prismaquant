# FIFO queue: one draft at a time checks up to 3 PRs on the newest main, in queue-label order.
# Each draft requires a passing "gate". A failed batch is split until the failing PR is found.
# No parallel checks, priority lanes or automatic retries.
# Add "queue" to queue. Remove it to dequeue. After failure, use "@mergifyio queue".
# Keep the issue check on original PRs and the TL3b App command allowance.

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]
  requeue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]

merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - label = queue
      - check-success = linked issue
    merge_conditions:
      - check-success = gate
    merge_method: merge
    batch_size: 3
    max_checks_retries: 0
    checks_timeout: 90 minutes

pull_request_rules:
  - name: queue pull requests labelled "queue"
    conditions:
      - base = main
      - label = queue
      - -draft
    actions:
      queue:
