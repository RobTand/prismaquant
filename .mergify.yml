# FIFO queue: check one PR at a time, in queue-label order.
# Each draft contains the newest main and requires a passing "gate".
# No batches, parallel checks, priority lanes, splits or automatic retries.
# Add "queue" to queue. Remove it to dequeue. After failure, use "@mergifyio queue".
# Original PRs name their issue in the body and the branch; keep the TL3b App command allowance.

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]
  requeue:
    conditions:
      - or:
          - sender-permission>=write
          - sender=tl3-robtand[bot]

merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false
  queued_label: queued
  dequeued_label: dequeued

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - -draft
      - label = queue
      # A PR names its issue; Mergify cannot check that the issue exists or is open.
      - body ~= (?im)^\s*(closes|fixes|resolves|refs|part of)\s+#[0-9]+
      - or:
          - head ~= ^prismaquant-[0-9]+(-[a-z0-9][a-z0-9-]*)?$
          - head ~= ^(ig|pg|pg-train)/
          - head ~= ^release
    merge_conditions:
      - check-success = gate
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0
    checks_timeout: 90 minutes

pull_request_rules:
  - name: queue pull requests labelled "queue"
    conditions:
      - base = main
      - label = queue
      - -draft
    actions:
      queue:
